<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meghbanni — Sarees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --khadi:#F0EADC; --surface:#FBF8F2; --ink:#1C1726; --ink-soft:#57506A;
  --madder:#97262B; --zari:#B08526; --line:rgba(28,23,38,.16);
  --display:'Marcellus',Georgia,serif; --text:'Karla',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --khadi:#15121D; --surface:#1B1726; --ink:#EFE8DA; --ink-soft:#B3A9BE;
  --madder:#D0585B; --zari:#D9AE4E; --line:rgba(239,232,218,.18);
}}
:root[data-theme="dark"]{
  --khadi:#15121D; --surface:#1B1726; --ink:#EFE8DA; --ink-soft:#B3A9BE;
  --madder:#D0585B; --zari:#D9AE4E; --line:rgba(239,232,218,.18);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--khadi);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--madder);outline-offset:3px}
.wrap{max-width:1020px;margin:0 auto;padding:0 18px}

/* gold temple border, the one decorative device */
.band{height:0}
.band::before{content:"";display:block;height:4px;background:var(--zari);opacity:.85}
.band::after{content:"";display:block;height:10px;opacity:.85;
  background-image:linear-gradient(135deg,var(--zari) 25%,transparent 25.5%),
                   linear-gradient(225deg,var(--zari) 25%,transparent 25.5%);
  background-size:13px 13px}

header{padding:26px 0 20px;text-align:center}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px);margin:0;letter-spacing:.04em}
header p{margin:8px 0 0;color:var(--ink-soft);font-size:16px}

/* shop photo */
.shopshot{margin:22px 0 0;aspect-ratio:16/9;overflow:hidden;background:var(--surface)}
.shopshot img{width:100%;height:100%;object-fit:cover}

h2{font-family:var(--display);font-weight:400;font-size:26px;margin:44px 0 6px;text-align:center}
.sub{text-align:center;color:var(--ink-soft);margin:0 0 26px;font-size:15px}

/* saree grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:10px}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(150deg,#8E1B2E,#C2415A 50%,#7A1226)}
.pic img{width:100%;height:100%;object-fit:cover}
.sold{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  background:rgba(28,23,38,.55);color:#FFF6E6;font-family:var(--display);font-size:19px;letter-spacing:.1em}
.card-body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0;line-height:1.3}
.price{font-size:16px;font-weight:700;margin:0}
.ask{margin-top:auto;padding-top:10px;font-size:14px;color:var(--madder);text-decoration:none;border-bottom:1px solid transparent;align-self:flex-start}
.ask:hover{border-bottom-color:var(--madder)}

/* contact */
.contact{background:var(--surface);margin-top:52px;padding:38px 0 42px;text-align:center}
.contact h2{margin-top:0}
.contact p{margin:0 0 18px;color:var(--ink-soft)}
.btn{display:inline-block;background:var(--madder);color:#FFF8EE;text-decoration:none;font-size:16px;font-weight:500;padding:14px 30px}
.btn:hover{background:#7d1f23}
.lines{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px;font-size:16px}
.lines a{color:inherit;text-decoration:none;border-bottom:1px solid var(--zari)}
footer{padding:22px 0 30px;text-align:center;font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>

<div class="band" aria-hidden="true"></div>

<header class="wrap">
  <h1>Meghbanni</h1>
  <p>Sarees available now</p>
  <!-- SHOP PHOTO: put your shop or a drape photo at images/shop.jpg -->
  <div class="shopshot"><img src="images/shop.jpg" alt="Our collection" onerror="this.style.display='none'"></div>
</header>

<main class="wrap">
  <h2>Our sarees</h2>
  <p class="sub">Tap any saree to ask about it on WhatsApp.</p>
  <div class="grid" id="grid"></div>
</main>

<section class="contact">
  <div class="wrap">
    <h2>Want to see more?</h2>
    <p>Message us and we will send photos and videos of whatever you like.</p>
    <a class="btn" id="mainWa" href="#">Message on WhatsApp</a>
    <ul class="lines">
      <li>Call <a href="tel:+919999999999">+91 99999 99999</a></li>
      <li>Instagram <a href="https://instagram.com/">@meghbanni</a></li>
    </ul>
  </div>
</section>

<div class="band" aria-hidden="true"></div>
<footer>© <span id="yr"></span> Meghbanni</footer>

<script>
/* ═══════════════════════════════════════════════════════════
   EDIT ONLY THIS PART

   1. Your WhatsApp number: country code + number, digits only.
   2. Your sarees: one line each. Copy a line to add another,
      delete a line to remove one.
      img  →  the photo's filename inside the images folder
      sold →  add   sold: true   when a saree is gone
   ═══════════════════════════════════════════════════════════ */

var PHONE = "919999999999";

var SAREES = [
  { name: "Red Kanjivaram silk",   price: "₹4,500", img: "images/saree-1.jpg" },
  { name: "Blue Banarasi",         price: "₹3,200", img: "images/saree-2.jpg" },
  { name: "Cream Jamdani",         price: "₹2,800", img: "images/saree-3.jpg" },
  { name: "Yellow Chanderi",       price: "₹1,900", img: "images/saree-4.jpg" },
  { name: "Green cotton handloom", price: "₹1,200", img: "images/saree-5.jpg" },
  { name: "Purple ikat",           price: "₹3,600", img: "images/saree-6.jpg", sold: true },
  { name: "Golden tussar",         price: "₹2,400", img: "images/saree-7.jpg" },
  { name: "Grey linen",            price: "₹1,600", img: "images/saree-8.jpg" }
];

/* ═══════ nothing below this line needs editing ═══════ */

(function () {
  var grid = document.getElementById("grid");
  var tints = ["#8E1B2E,#C2415A","#1F3C63,#3E6EA8","#CFC7AF,#E8E2D2","#D8A24A,#F0D08A",
               "#2C5E4F,#4E8A73","#4A2C62,#7C5498","#6E5232,#A57C49","#8A8D96,#C4C7CE"];

  SAREES.forEach(function (s, i) {
    var card = document.createElement("article");
    card.className = "card";

    var pic = document.createElement("div");
    pic.className = "pic";
    pic.style.background = "linear-gradient(150deg," + tints[i % tints.length] + ")";

    if (s.img) {
      var im = document.createElement("img");
      im.src = s.img;
      im.alt = s.name;
      im.loading = "lazy";
      im.onerror = function () { this.remove(); };
      pic.appendChild(im);
    }
    if (s.sold) {
      var tag = document.createElement("div");
      tag.className = "sold";
      tag.textContent = "Sold";
      pic.appendChild(tag);
    }

    var body = document.createElement("div");
    body.className = "card-body";

    var h = document.createElement("h3");
    h.textContent = s.name;

    var p = document.createElement("p");
    p.className = "price";
    p.textContent = s.price;

    body.appendChild(h);
    body.appendChild(p);

    if (!s.sold) {
      var a = document.createElement("a");
      a.className = "ask";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Ask about this";
      a.href = "https://wa.me/" + PHONE + "?text=" +
        encodeURIComponent("Hello, I am interested in the " + s.name + " (" + s.price + ").");
      body.appendChild(a);
    }

    card.appendChild(pic);
    card.appendChild(body);
    grid.appendChild(card);
  });

  document.getElementById("mainWa").href =
    "https://wa.me/" + PHONE + "?text=" + encodeURIComponent("Hello, I would like to see your sarees.");
  document.getElementById("yr").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
